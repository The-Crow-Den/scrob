name: Apply recent Next Up recovery patch

on:
  push:
    branches:
      - feature/recent-next-up-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply focused Next Up patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def patch_file(path: str, replacements: list[tuple[str, str]]) -> None:
              p = Path(path)
              raw = p.read_bytes()
              newline = "\r\n" if b"\r\n" in raw else "\n"
              text = raw.decode("utf-8").replace("\r\n", "\n")
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected exactly one patch anchor, found {count}\nANCHOR:\n{old[:300]}")
                  text = text.replace(old, new, 1)
              if newline == "\r\n":
                  text = text.replace("\n", "\r\n")
              p.write_bytes(text.encode("utf-8"))

