name: Validate fork sync

on:
  push:
    branches:
      - sync/upstream-2026-11-02

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen --no-dev
      - name: Install upstream test-only SQLite driver
        working-directory: backend
        run: uv pip install aiosqlite
      - name: Run fork and affected upstream tests
        working-directory: backend
        run: |
          uv run python -m unittest \
            tests.test_fork_customizations \
            tests.test_next_up \
            tests.test_episode_order \
            tests.test_media \
            tests.test_webhooks
