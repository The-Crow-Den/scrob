name: Validate Velum history sync

on:
  push:
    branches:
      - feature/velum-history-sync

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          uv pip install aiosqlite
      - name: Validate imports, migrations and affected tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          SECRET_KEY: test-secret
        run: |
          uv run python -m py_compile \
            core/history_sync.py \
            core/native_playback.py \
            routers/v1_history.py \
            routers/v1_playback.py
          uv run alembic heads
          uv run python -m unittest \
            tests.test_activity_foundation \
            tests.test_native_playback \
            tests.test_history_sync \
            tests.test_webhooks \
            tests.test_media \
            tests.test_next_up
