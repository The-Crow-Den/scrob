name: Branch build

on:
  push:
    branches-ignore: [main]

jobs:
  build:
    name: Build branch image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply recent Next Up recovery patch
        run: python tools/apply_recent_next_up_recovery.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend project dependencies
        run: python -m pip install ./backend

      - name: Run focused tests
        working-directory: backend
        run: python -m unittest tests.test_history tests.test_episode_order

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routers/history.py backend/tests/test_history.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: recover recent rewatches in Next Up"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g')"
          echo "name=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.image.outputs.tag }}-dev
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=scrob-${{ steps.image.outputs.tag }}
          cache-to: type=gha,mode=max,scope=scrob-${{ steps.image.outputs.tag }}

      - name: Build and push omnibus
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.omnibus
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.image.outputs.tag }}-dev
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}-omnibus
          cache-from: type=gha,scope=scrob-omnibus-${{ steps.image.outputs.tag }}
          cache-to: type=gha,mode=max,scope=scrob-omnibus-${{ steps.image.outputs.tag }}
